<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Tareas - ServiTareas</title>

<link rel="stylesheet" href="/src/main/resources/fronted/css/tareas.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<div class="container">

    <!-- MENU -->
    <aside class="sidebar">

        <div class="logo">
            <img src="/fronted/Imagenes/Oso.webp" alt="Oso">
            <h2>Servi-Tareas</h2>
        </div>

        <nav>
            <a href="dashboard.html">
                <i class="fas fa-chart-line"></i>
                Dashboard
            </a>

            <a href="usuarios.html">
                <i class="fas fa-user"></i>
                Usuarios
            </a>

                 <a href="comentarios.html">
           <i class="fas fa-comments"></i>
                comentarios
            </a>

            <a class="active" href="tareas.html">
                <i class="fas fa-list-check"></i>
                Tareas
            </a>




                          <a href="registro.html">
                <i class="fas fa-right-from-bracket"></i>
                Cerrar Sesión
            </a>

            </a>
        </nav>

    </aside>

    <!-- CONTENIDO -->

    <main class="contenido">

        <h1>Gestión de Tareas</h1>

        <!-- TARJETAS -->

        <section class="cards">

            <div class="card">
                <h2>48</h2>
                <p>Total Tareas</p>
            </div>

            <div class="card">
                <h2>15</h2>
                <p>Pendientes</p>
            </div>

            <div class="card">
                <h2>10</h2>
                <p>En Proceso</p>
            </div>

            <div class="card">
                <h2>23</h2>
                <p>Completadas</p>
            </div>

        </section>

        <!-- FORMULARIO -->

        <section class="formulario">

            <h2>Nueva Tarea</h2>

            <form>

                <input type="text"
                placeholder="Título de la tarea">

                <textarea
                placeholder="Descripción de la tarea"></textarea>

                <input type="date">

                <select>
                    <option>Alta</option>
                    <option>Media</option>
                    <option>Baja</option>
                </select>

                <select>
                    <option>Pendiente</option>
                    <option>En Proceso</option>
                    <option>Completada</option>
                </select>

                <select>
                    <option>Proyecto Web</option>
                    <option>Sistema Inventario</option>
                </select>

                <select>
                    <option>Fiorella</option>
                    <option>Darwin</option>
                    <option>Yemile</option>
                </select>

                <button type="button">
                    Guardar Tarea
                </button>

            </form>

        </section>

        <!-- TABLA -->

        <section class="tabla">

            <h2>Lista de Tareas</h2>

            <table>

                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Prioridad</th>
                        <th>Estado</th>
                        <th>Proyecto</th>
                        <th>Asignado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                
            </table>

        </section>

    </main>

</div>

</body>
</html>
