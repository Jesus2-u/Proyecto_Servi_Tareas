<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - ServiTareas</title>
    <link rel="stylesheet" href="/src/main/resources/fronted/css/registro.css">
</head>
<body>

<div class="container">

    <!-- FORMULARIO -->
    <div class="form-section">

        <h2>Registro de Usuario</h2>

        <form>

            <div class="input-group">
                <label>Nombre</label>
                <input type="text" placeholder="Ingrese su nombre">
            </div>

            <div class="input-group">
                <label>Apellido</label>
                <input type="text" placeholder="Ingrese su apellido">
            </div>

            <div class="input-group">
                <label>Correo Electrónico</label>
                <input type="email" placeholder="correo@ejemplo.com">
            </div>

            <div class="input-group">
                <label>Fecha de Registro</label>
                <input type="date">
            </div>

            <div class="input-group">
                <label>Estado</label>
                <select>
                    <option>Activo</option>
                    <option>Inactivo</option>
                </select>
            </div>

            <button type="button" onclick="window.location.href='dashboard.html'">
                Registrar Usuario
            </button>

        </form>

    </div>

    <!-- INFORMACIÓN -->
    <div class="info-section">

        <img src="/fronted/Imagenes/Oso.webp" alt="Oso ServiTareas">

        <h1>Servi-Tareas</h1>

        <p>
            Organiza, asigna y cumple tus tareas
            de forma rápida y eficiente.
        </p>

        <p class="slogan">
            Gestiona proyectos, usuarios y tareas
            desde una sola plataforma.
        </p>

    </div>

</div>

</body>
</html>
