<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Usuario - ServiTareas</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/registro.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="contenedor-app">

    <aside class="sidebar">
        <div class="logo">
            <div class="brand-icon-wrapper">
                <img th:src="@{/Imagenes/Oso.webp}" alt="Oso" class="brand-bear">
            </div>
            <h2>Servi-Tareas</h2>
        </div>

        <nav class="nav-links">
            <a th:href="@{/dashboard}">
                <i class="fas fa-chart-line"></i><span>Dashboard</span>
            </a>
            <a th:href="@{/usuarios}">
                <i class="fas fa-user"></i><span>Usuarios</span>
            </a>
            <a th:href="@{/proyectos}">
                <i class="fas fa-folder-open"></i><span>Proyectos</span>
            </a>
            <a th:href="@{/comentarios}">
                <i class="fas fa-comments"></i><span>Comentarios</span>
            </a>
            <a th:href="@{/tareas}">
                <i class="fas fa-list-check"></i><span>Tareas</span>
            </a>
            <div class="nav-spacer"></div>
            <a th:href="@{/logout}" class="btn-logout">
                <i class="fas fa-right-from-bracket"></i><span>Cerrar Sesión</span>
            </a>
        </nav>
    </aside>

    <main class="contenido-main">

        <header class="content-header">
            <div class="header-search">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Buscar usuarios...">
            </div>

            <div class="user-profile-top">
                <span class="user-name">Sistema</span>
                <div class="avatar-mini"></div>
            </div>
        </header>

        <div class="dashboard-workspace">

            <section class="card-form-wrapper">

                <!-- ✅ SOLO USUARIO -->
                <h3 th:text="${usuario.idUsuario == null ? '➕ Registro de Usuario' : '📝 Editar Usuario'}">
                    Registro Usuario
                </h3>

                <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">

                    <input type="hidden" th:field="*{idUsuario}"/>

                    <div class="input-group">
                        <label>Nombre</label>
                        <input type="text" th:field="*{nombre}" required>
                    </div>

                    <div class="input-group">
                        <label>Apellido</label>
                        <input type="text" th:field="*{apellido}" required>
                    </div>

                    <div class="input-group">
                        <label>Correo</label>
                        <input type="email" th:field="*{correo}" required>
                    </div>

                    <div class="input-group">
                        <label>Contraseña</label>
                        <input type="password" th:field="*{password}" required>
                    </div>

                    <div class="input-group">
                        <label>Estado</label>
                        <select th:field="*{estado}">
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">
                            <span th:text="${usuario.idUsuario == null ? 'Guardar Usuario' : 'Actualizar Usuario'}">
                                Guardar Usuario
                            </span>
                        </button>

                        <a th:href="@{/usuarios}" class="btn-secondary">Cancelar</a>
                    </div>

                </form>

            </section>

        </div>

    </main>

</div>

</body>
</html>
