<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - ServiTareas</title>

    <link rel="stylesheet" th:href="@{/css/registro.css}">
</head>
<body>

<div class="container">

    <!-- FORMULARIO -->
    <div class="form-section">

        <!-- TÍTULO DINÁMICO (CREAR / EDITAR) -->
        <h2 th:text="${usuario.idUsuario == null ? 'Registro de Usuario' : 'Editar Usuario'}"></h2>

        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">

            <!-- IMPORTANTE: para editar correctamente -->
            <input type="hidden" th:field="*{idUsuario}"/>

            <div class="input-group">
                <label>Nombre</label>
                <input type="text" th:field="*{nombre}" placeholder="Ingrese su nombre">
            </div>

            <div class="input-group">
                <label>Apellido</label>
                <input type="text" th:field="*{apellido}" placeholder="Ingrese su apellido">
            </div>

            <div class="input-group">
                <label>Correo Electrónico</label>
                <input type="email" th:field="*{correo}" placeholder="correo@ejemplo.com">
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" th:field="*{password}" placeholder="Ingrese contraseña">
            </div>

            <div class="input-group">
                <label>Estado</label>
                <select th:field="*{estado}">
                    <option th:value="true">Activo</option>
                    <option th:value="false">Inactivo</option>
                </select>
            </div>

            <!-- BOTÓN DINÁMICO -->
            <button type="submit"
                    th:text="${usuario.idUsuario == null ? 'Guardar Usuario' : 'Actualizar Usuario'}">
            </button>

        </form>

    </div>

    <!-- INFORMACIÓN -->
    <div class="info-section">

        <img th:src="@{/Imagenes/Oso.webp}" alt="Oso ServiTareas">

        <h1>Servi-Tareas</h1>

        <p>
            Organiza, asigna y cumple tus tareas
            de forma rápida y eficiente.
        </p>

        <p class="slogan">
            Gestiona proyectos, usuarios y tareas
            desde una sola plataforma.
        </p>

    </div>

</div>

</body>
</html>
