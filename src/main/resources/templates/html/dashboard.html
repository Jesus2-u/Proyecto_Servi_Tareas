<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - ServiTareas</title>

<link rel="stylesheet" th:href="@{/css/dashboard.css}">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- MENU LATERAL -->
    <aside class="sidebar">

        <div class="logo">
            <img th:src="@{/Imagenes/Oso.webp}" alt="Oso">
            <h2>Servi-Tareas</h2>
        </div>

        <nav>

            <a class="active" th:href="@{/dashboard}">
                <i class="fas fa-chart-line"></i>
                Dashboard
            </a>

            <a th:href="@{/usuarios}">
                <i class="fas fa-user"></i>
                Usuarios
            </a>
<a th:href="@{/proyectos}">
    <i class="fas fa-folder-open"></i>
    Proyectos
</a>
            <a th:href="@{/comentarios}">
                <i class="fas fa-comments"></i>
                Comentarios
            </a>

            <a th:href="@{/tareas}">
                <i class="fas fa-list-check"></i>
                Tareas
            </a>

            <a th:href="@{/registro}">
                <i class="fas fa-right-from-bracket"></i>
                Cerrar Sesión
            </a>

        </nav>

    </aside>

    <!-- CONTENIDO -->
    <main class="contenido">

        <header>

            <h1>Dashboard</h1>

            <div class="usuario">
                Bienvenido 👋
            </div>

        </header>

        <!-- TARJETAS -->
        <section class="cards">

            <div class="card">
                <i class="fas fa-folder"></i>
                <h3 th:text="${totalProyectos}">0</h3>
                <p>Proyectos</p>
            </div>

            <div class="card">
                <i class="fas fa-list-check"></i>
                <h3 th:text="${totalTareas}">0</h3>
                <p>Tareas</p>
            </div>

            <div class="card">
                <i class="fas fa-clock"></i>
                <h3 th:text="${tareasPendientes}">0</h3>
                <p>Pendientes</p>
            </div>

            <div class="card">
                <i class="fas fa-check-circle"></i>
                <h3 th:text="${tareasCompletadas}">0</h3>
                <p>Completadas</p>
            </div>

        </section>

        <!-- GRAFICO -->
        <section class="grafico">

            <h2>Progreso de Tareas</h2>

            <div class="barras">

                <div class="barra">
                    <div style="height:60%"></div>
                    <span>Lun</span>
                </div>

                <div class="barra">
                    <div style="height:85%"></div>
                    <span>Mar</span>
                </div>

                <div class="barra">
                    <div style="height:40%"></div>
                    <span>Mie</span>
                </div>

                <div class="barra">
                    <div style="height:95%"></div>
                    <span>Jue</span>
                </div>

                <div class="barra">
                    <div style="height:75%"></div>
                    <span>Vie</span>
                </div>

            </div>

        </section>

        <!-- TABLA -->
        <section class="tabla">

            <h2>Últimas Tareas</h2>

            <table>

                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Prioridad</th>
                        <th>Estado</th>
                        <th>Fecha Límite</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="t : ${ultimasTareas}">
                        <td th:text="${t.titulo}"></td>
                        <td th:text="${t.prioridad}"></td>
                        <td th:text="${t.estado}"></td>
                        <td th:text="${t.fechaLimite}"></td>
                    </tr>

                </tbody>

            </table>

        </section>

    </main>

</div>

</body>
</html>
