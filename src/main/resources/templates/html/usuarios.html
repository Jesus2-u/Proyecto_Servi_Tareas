<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios - ServiTareas</title>

<link rel="stylesheet" th:href="@{/css/usuarios.css}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<div class="container">

    <aside class="sidebar">

        <div class="logo">
            <img th:src="@{/Imagenes/Oso.webp}" alt="Oso">
            <h2>Servi-Tareas</h2>
        </div>

        <nav>

            <a th:href="@{/dashboard}">
                <i class="fas fa-chart-line"></i>
                Dashboard
            </a>

            <a class="active" th:href="@{/usuarios}">
                <i class="fas fa-user"></i>
                Usuarios
            </a>

            <a th:href="@{/comentarios}">
                <i class="fas fa-comments"></i>
                Comentarios
            </a>

            <a th:href="@{/tareas}">
                <i class="fas fa-list-check"></i>
                Tareas
            </a>

            <a th:href="@{/registro}">
                <i class="fas fa-right-from-bracket"></i>
                Cerrar Sesión
            </a>

        </nav>

    </aside>

    <main class="contenido">

        <div class="encabezado">
            <h1>Gestión de Usuarios</h1>

            <!-- IR AL FORMULARIO (CREAR) -->
            <a class="btn-nuevo" th:href="@{/usuarios/nuevo}">
                <i class="fas fa-plus"></i>
                Nuevo Usuario
            </a>
        </div>

        <div class="tabla-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Correo</th>
                        <th>Fecha Registro</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.idUsuario}"></td>
                        <td th:text="${usuario.nombre}"></td>
                        <td th:text="${usuario.apellido}"></td>
                        <td th:text="${usuario.correo}"></td>
                        <td th:text="${usuario.fechaRegistro}"></td>

                        <td>
                            <span class="activo"
                                  th:text="${usuario.estado ? 'Activo' : 'Inactivo'}"></span>
                        </td>

                        <td>

                            <!-- EDITAR -->
                            <a class="editar"
                               th:href="@{/usuarios/editar/{id}(id=${usuario.idUsuario})}">
                                Editar
                            </a>

                            <!-- ELIMINAR -->
                            <a class="eliminar"
                               th:href="@{/usuarios/eliminar/{id}(id=${usuario.idUsuario})}"
                               onclick="return confirm('¿Seguro que deseas eliminar este usuario?')">
                                Eliminar
                            </a>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

</div>

</body>
</html>
