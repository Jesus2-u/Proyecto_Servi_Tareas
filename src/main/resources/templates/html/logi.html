<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ServiTareas</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="login-container">
    <div class="login-card-wrapper">
        <div class="polar-bear-area">
            <div class="bear-sleeping">
                <div class="bear-illustration">
                    <div class="bear-body"></div>
                    <div class="bear-head">
                        <div class="ear left"><div class="ear-inner"></div></div>
                        <div class="ear right"><div class="ear-inner"></div></div>
                        <div class="eyes">
                            <div class="eye"><div class="eyebrow"></div></div>
                            <div class="eye"><div class="eyebrow"></div></div>
                        </div>
                        <div class="nose"></div>
                        <div class="mouth"></div>
                    </div>
                    <div class="bear-arms">
                        <div class="arm left"></div>
                        <div class="arm right"></div>
                    </div>
                    <div class="paw left-paw"></div>
                    <div class="paw right-paw"></div>
                    <div class="droplet"></div>
                </div>
            </div>
        </div>

        <form id="loginForm" class="login-form" th:action="@{/login}" method="post">
            <div class="form-title">
                <div class="brand-tag">Servi-Tareas</div>
                <h2>Accede a tu entorno académico</h2>
            </div>

            <div class="input-group">
                <label>Correo electrónico</label>
                <input id="email" class="input-field" type="email" name="correo" placeholder="tu@correo.com" required>
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <input id="password" class="input-field" type="password" name="password" placeholder="********" required>
            </div>

            <button type="submit" class="btn-login">Iniciar sesión →</button>

            <div class="register-link">
                ¿No tienes una cuenta? <a id="registerMock" th:href="@{/usuarios/nuevo}">Regístrate</a>
            </div>

            <p class="extra-info">Demo: admin@servitareas.com / any password</p>
        </form>
    </div>
</div>

<script th:src="@{/js/Login.js}"></script>
</body>
</html>
