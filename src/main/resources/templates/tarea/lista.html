<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tareas</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        .btn {
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn-edit {
            background-color: #4CAF50;
            color: white;
        }

        .btn-delete {
            background-color: #f44336;
            color: white;
        }

        .btn-new {
            background-color: #2196F3;
            color: white;
            margin-bottom: 10px;
            display: inline-block;
        }
    </style>
</head>
<body>

<h1>Lista de Tareas</h1>

<a class="btn btn-new" th:href="@{/tareas/nuevo}">Nueva Tarea</a>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Descripción</th>
            <th>Fecha Límite</th>
            <th>Prioridad</th>
            <th>Estado</th>
            <th>Proyecto</th>
            <th>Usuario</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="tarea : ${tareas}">
            <td th:text="${tarea.idTarea}"></td>
            <td th:text="${tarea.titulo}"></td>
            <td th:text="${tarea.descripcion}"></td>
            <td th:text="${tarea.fechaLimite}"></td>
            <td th:text="${tarea.prioridad}"></td>
            <td th:text="${tarea.estado}"></td>

            <td th:text="${tarea.proyecto != null ? tarea.proyecto.nombre : 'Sin proyecto'}"></td>
            <td th:text="${tarea.usuarioAsignado != null ? tarea.usuarioAsignado.nombre : 'Sin usuario'}"></td>

            <td>
                <a class="btn btn-edit"
                   th:href="@{'/tareas/editar/' + ${tarea.idTarea}}">Editar</a>

                <a class="btn btn-delete"
                   th:href="@{'/tareas/eliminar/' + ${tarea.idTarea}}"
                   onclick="return confirm('¿Seguro que deseas eliminar?')">Eliminar</a>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
